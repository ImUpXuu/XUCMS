name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: version.json's changelog is derived from the commits since
          # the last versionCode bump, which a shallow clone cannot see.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/XUCMS-debug.apk
          for candidate in app-release.apk app-release-unsigned.apk; do
            if [ -f "app/build/outputs/apk/release/$candidate" ]; then
              cp "app/build/outputs/apk/release/$candidate" "build-artifacts/XUCMS-release.apk"
              break
            fi
          done
          ls -la build-artifacts

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XUCMS-apk
          path: build-artifacts/*

      - name: Resolve release tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            export TZ="Asia/Shanghai"
            echo "name=build-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      # version.json must live on the default branch, not as a release asset: the
      # in-app check reads it through a GitHub raw mirror, and asset URLs are not
      # raw-mirrorable.
      - name: Generate version.json
        if: github.event_name != 'pull_request'
        run: |
          chmod +x scripts/generate-version-json.sh
          ./scripts/generate-version-json.sh "${{ steps.tag.outputs.name }}"

      - name: Commit version.json
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        run: |
          if git diff --quiet -- version.json; then
            echo "version.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore(release): update version.json for ${{ steps.tag.outputs.name }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: build-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
